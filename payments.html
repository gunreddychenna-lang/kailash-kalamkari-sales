<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Management | Kailash Kalamkari</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4ef;color:#302820;font:14px system-ui,sans-serif}
header{background:#5c0612;color:#fff;padding:18px 24px}
header a{color:#ffe3ad;text-decoration:none}
h1{margin:8px 0;font:26px Georgia,serif}
main{max-width:1600px;margin:auto;padding:18px}
.toolbar,.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:15px}
.toolbar{justify-content:space-between}
label{font-weight:600}
input,select,button{font:inherit;padding:9px;border:1px solid #cbbba9;border-radius:6px}
button{background:#5c0612;color:white;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{background:white}
.filters label{display:grid;gap:5px}
.filters input{min-width:210px}
.panel{background:white;border:1px solid #e3d8c8;border-radius:10px;overflow:hidden}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #ede5d8;vertical-align:top}
th{background:#f4ece0;position:sticky;top:0;white-space:nowrap}
th button{background:transparent;color:#302820;border:0;padding:0;font-weight:700}
tbody tr:hover{background:#fdf9f2}
.amount{text-align:right;white-space:nowrap}
.ledger button{padding:6px 12px}
.ledger-details{margin-top:10px;padding:12px;background:#faf5ed;border-radius:8px;min-width:350px}
.ledger-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:8px 0}
.ledger-row input,.ledger-row select{width:100%;min-width:0}
.note{background:#fff1cc;border:1px solid #e5c984;padding:12px;border-radius:8px;margin-bottom:16px}
#status{padding:12px}
.small{font-size:12px;color:#756d63}
.actions{display:flex;gap:9px;align-items:center}
@media(max-width:700px){main{padding:10px}.ledger-row{grid-template-columns:1fr 1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/staff-config"></script>
<script src="security-permissions.js"></script>
<script src="security-auth.js"></script>
<script src="common.js"></script>
<script defer src="payments-table.js"></script>
</head>
<body>
<header>
<a href="index.html">← Sales Dashboard</a>
<h1>Payment Management</h1>
</header>
<main>
<div class="toolbar">
<div>
<strong>Sales Payment Entry</strong>
<div class="small">Kailash Kalamkari | Main Branch & KHPS</div>
</div>
<div class="actions">
<span id="draft-count">0 draft bills</span>
<button id="save-all" type="button" disabled>Save All</button>
</div>
</div>

<div class="note">
Historical opening balances need Owner verification.
You can review invoices and prepare payment drafts.
Production saving is not enabled.
</div>

<div class="filters">
<label>Store
<select id="store">
<option value="All">All Stores</option>
<option value="Main Branch">Main Branch</option>
<option value="KHPS">KHPS</option>
</select>
</label>

<label>Payment Status
<select id="settlement">
<option value="review">Needs Review</option>
<option value="pending" disabled>Pending — awaiting verification</option>
<option value="settled" disabled>Settled — awaiting verification</option>
</select>
</label>

<label>Search Bill / Agent / Customer
<input id="search" placeholder="Search all bills">
</label>

<button id="find" type="button">Search</button>
<button id="next" type="button">Next 50</button>
</div>

<div class="panel scroll">
<table>
<thead>
<tr>
<th><button data-sort="agent">Sales Agent ↕</button></th>
<th><button data-sort="channel">Offline / Online / Take by Hand ↕</button></th>
<th><button data-sort="bill">Bill No. ↕</button></th>
<th class="amount"><button data-sort="amount">Amount ↕</button></th>
<th>Payment Ledger</th>
</tr>
</thead>
<tbody id="invoice-rows"></tbody>
</table>
</div>
<p id="status" role="status">Checking Owner/Admin access...</p>
</main>
</body>
</html>
