<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KK | Employee Management</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="security-permissions.js"></script>
  <script src="security-auth.js"></script>
  <script src="common.js?v=3"></script>
  <script src="staff-config.js"></script>
  <script src="staff-page.js" defer></script>
</head>
<body class="bg-[#FAF6EE] text-stone-800 min-h-screen">
  <header class="bg-[#5C0612] text-[#EFE5C9] border-b-2 border-[#DAA520] p-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold">Kailash Kalamkari</h1>
        <p class="text-xs">Employee Access Management</p>
      </div>
      <a href="index.html" class="text-sm border border-[#DAA520] rounded-lg p-2">
        Dashboard
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-5">
    <p id="message" role="status" aria-live="polite"
       class="rounded-xl bg-white border border-[#E5D5C6] p-3 text-sm">
      Verifying Owner/Admin access...
    </p>

    <div id="workspace" class="hidden space-y-5">

      <section class="bg-white rounded-2xl p-5 border border-[#E5D5C6]">
        <h2 class="font-bold text-[#5C0612] mb-4">Create Employee Login</h2>

        <form id="create-form" class="grid sm:grid-cols-2 gap-4">
          <label class="text-sm">Login ID
            <input id="login-id" required minlength="3" maxlength="32"
              pattern="[a-zA-Z0-9._-]+"
              autocomplete="off"
              class="block w-full mt-1 border rounded-lg p-3">
          </label>

          <label class="text-sm">Employee Name
            <input id="display-name" required maxlength="100"
              class="block w-full mt-1 border rounded-lg p-3">
          </label>

          <label class="text-sm">Email for Authentication
            <input id="email" type="email" required
              autocomplete="off"
              class="block w-full mt-1 border rounded-lg p-3">
          </label>

          <label class="text-sm">Temporary Password (min 12 characters)
            <input id="password" type="password" required minlength="12"
              autocomplete="new-password"
              class="block w-full mt-1 border rounded-lg p-3">
          </label>

          <fieldset class="border rounded-xl p-3">
            <legend class="font-semibold text-sm">Allowed Stores</legend>
            <div id="create-stores" class="space-y-2"></div>
          </fieldset>

          <fieldset class="border rounded-xl p-3">
            <legend class="font-semibold text-sm">Allowed Features</legend>
            <div id="create-features" class="grid grid-cols-2 gap-2"></div>
          </fieldset>

          <button id="create-button" type="submit"
            class="sm:col-span-2 bg-[#5C0612] text-white p-3 rounded-xl font-bold">
            Create Employee Account
          </button>
        </form>
      </section>

      <section class="bg-white rounded-2xl p-5 border border-[#E5D5C6]">
        <div class="flex justify-between items-center gap-2 mb-4">
          <h2 class="font-bold text-[#5C0612]">Employee Accounts</h2>
          <button id="refresh-button"
            class="bg-[#5C0612] text-white rounded-lg px-4 py-2 text-sm">
            Refresh
          </button>
        </div>
        <div id="employees" class="space-y-3"></div>
      </section>
    </div>
  </main>
</body>
</html>
