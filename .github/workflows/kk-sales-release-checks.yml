name: KK Sales-Only Release Checks

on:
  push:
    branches:
      - engineering/kk-ceo-006-checkpoint
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-only-tests:
    name: Security and Financial Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run existing test suite
        run: node --test tests/*.test.cjs

      - name: Validate server and API syntax
        run: |
          node --check release-server.cjs
          node --check lib/sales-db.cjs
          node --check api/staff-login.js
          node --check api/owner-sales.js
          node --check api/payment-requests.js
          node --check api/owner-dashboard.js
